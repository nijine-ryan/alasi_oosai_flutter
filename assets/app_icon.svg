<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep navy to primary blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A4B7A;stop-opacity:1" />
    </linearGradient>

    <!-- Wave shimmer gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#4299F0;stop-opacity:0.9" />
      <stop offset="50%"  style="stop-color:#63B3FF;stop-opacity:1"   />
      <stop offset="100%" style="stop-color:#4299F0;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#2B7FCC;stop-opacity:0.8" />
      <stop offset="50%"  style="stop-color:#4299F0;stop-opacity:1"   />
      <stop offset="100%" style="stop-color:#2B7FCC;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#1A5C99;stop-opacity:0.6" />
      <stop offset="50%"  style="stop-color:#2B7FCC;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1A5C99;stop-opacity:0.5" />
    </linearGradient>

    <!-- Glow filter for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow in the centre -->
  <radialGradient id="centreGlow" cx="50%" cy="55%" r="50%">
    <stop offset="0%"   style="stop-color:#4299F0;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#0D2B4E;stop-opacity:0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#centreGlow)"/>

  <g clip-path="url(#roundedClip)">
    <!-- Wave 3 (back / darkest) -->
    <path d="
      M -60 620
      C 80 560, 200 680, 340 620
      C 480 560, 560 680, 700 620
      C 840 560, 940 660, 1084 610
      L 1084 1100
      L -60 1100
      Z"
      fill="url(#wave3Grad)"
      filter="url(#glow)"
      opacity="0.75"
    />

    <!-- Wave 2 (mid) -->
    <path d="
      M -60 680
      C 60 610, 190 730, 340 670
      C 490 610, 580 730, 720 668
      C 860 606, 960 710, 1084 660
      L 1084 1100
      L -60 1100
      Z"
      fill="url(#wave2Grad)"
      filter="url(#softGlow)"
      opacity="0.85"
    />

    <!-- Wave 1 (front / brightest) -->
    <path d="
      M -60 745
      C 70 675, 210 790, 360 725
      C 510 660, 600 780, 740 718
      C 880 656, 975 760, 1084 715
      L 1084 1100
      L -60 1100
      Z"
      fill="url(#wave1Grad)"
      filter="url(#softGlow)"
    />

    <!-- Foam highlight on front wave -->
    <path d="
      M -60 745
      C 70 675, 210 790, 360 725
      C 510 660, 600 780, 740 718
      C 880 656, 975 760, 1084 715"
      stroke="rgba(255,255,255,0.35)"
      stroke-width="3.5"
      fill="none"
      stroke-linecap="round"
    />
  </g>

  <!-- "A O" monogram — Alai Oosai, centred above waves -->
  <text
    x="512" y="430"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="210"
    letter-spacing="-8"
    fill="#FFFFFF"
    filter="url(#softGlow)"
    opacity="0.97"
  >AO</text>

  <!-- Thin underline accent below monogram -->
  <rect x="352" y="468" width="320" height="4" rx="2" fill="#4299F0" opacity="0.9"/>
</svg>
